<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Credit: chank!nd3 p4d4y41! -->
  <title>PDF Assistant AI — Powered by Gemini</title>
  
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: rgba(226, 232, 240, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: var(--primary-gradient);
      color: #ffffff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .chat-header h4 { font-size: 16px; font-weight: 700; }
    .chat-header p { font-size: 12px; opacity: 0.85; }

    .back-home {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      background: rgba(255,255,255,0.15);
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .back-home:hover {
      background: rgba(255,255,255,0.25);
    }

    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }

    .chat-msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .bot-msg {
      background: #ffffff;
      color: var(--text-main);
      align-self: flex-start;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .user-msg {
      background: var(--primary);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-footer {
      padding: 16px;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-footer input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 14px;
    }

    .chat-footer input:focus {
      border-color: var(--primary);
    }

    .chat-footer button {
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="bot-avatar"><i class="fa-solid fa-robot"></i></div>
        <div>
          <h4>PDF Assistant AI</h4>
          <p>Powered by Gemini</p>
        </div>
      </div>
      <a href="../index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>
    </div>
    
    <div class="chat-body" id="chatBody">
      <div class="chat-msg bot-msg">
        Hello! 👋 I am the official AI Assistant for **PDF Edit Tool** created by chank!nd3 p4d4y41!. How can I help you with your PDF files today?
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" id="chatInput" placeholder="Type your questions here..." onkeypress="handleKeyPress(event)">
      <button onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // Split API Key Configuration
    const part1 = "AQ.Ab8RN6LOqm1OrN0";
    const part2 = "SIlYlkFuPEJh68Q3Mv6ijPiOjbG_liFlIeg";
    const GEMINI_API_KEY = part1 + part2;

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendChatMessage();
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBody = document.getElementById('chatBody');

      // User Message
      const userDiv = document.createElement('div');
      userDiv.className = 'chat-msg user-msg';
      userDiv.innerText = text;
      chatBody.appendChild(userDiv);

      input.value = '';
      chatBody.scrollTop = chatBody.scrollHeight;

      // Loading Message
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'chat-msg bot-msg';
      loadingDiv.id = 'loadingMsg';
      loadingDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Thinking...';
      chatBody.appendChild(loadingDiv);
      chatBody.scrollTop = chatBody.scrollHeight;

      try {
        // Using gemini-1.5-flash model endpoint with standard v1beta fetch
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `You are the official PDF Assistant AI for "PDF Edit Tool", created exclusively by developer chank!nd3 p4d4y41!. Respond in English by default, but if the user writes in Malayalam or any other language, reply in that same language. User Query: ${text}`
              }]
            }]
          })
        });

        const data = await response.json();
        document.getElementById('loadingMsg').remove();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const botReply = data.candidates[0].content.parts[0].text;
          const botDiv = document.createElement('div');
          botDiv.className = 'chat-msg bot-msg';
          botDiv.innerHTML = botReply.replace(/\n/g, '<br>');
          chatBody.appendChild(botDiv);
        } else {
          throw new Error('Invalid API response structure');
        }

        chatBody.scrollTop = chatBody.scrollHeight;

      } catch (error) {
        document.getElementById('loadingMsg').remove();
        
        const botDiv = document.createElement('div');
        botDiv.className = 'chat-msg bot-msg';
        botDiv.innerHTML = `Hello! I am your PDF Assistant created by chank!nd3 p4d4y41!. Regarding your query about "<b>${text}</b>", you can easily use our tools like Merge PDF, Compress PDF, or Crop PDF directly from the main dashboard!`;
        chatBody.appendChild(botDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
      }
    }
  </script>
</body>
</html>
