<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live PDF Editor & Tools</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

  <header>
    <h1>📄 Interactive PDF Editor</h1>
    <p>Upload, Edit with Live Preview & Download Securely</p>
  </header>

  <main class="container">
    
    <!-- Controls Section -->
    <div class="card controls-card">
      <h3>1. Upload & Add Content</h3>
      
      <label for="pdf-input">Select PDF Document:</label>
      <input type="file" id="pdf-input" accept="application/pdf">

      <hr>

      <label for="text-input">Text Overlay:</label>
      <input type="text" id="text-input" placeholder="Type text to place on PDF">

      <label for="img-input">Add Image/Photo:</label>
      <input type="file" id="img-input" accept="image/png, image/jpeg">

      <button onclick="applyAndDownload()">Export & Download PDF</button>
      <div id="status"></div>
    </div>

    <!-- Live Preview Canvas Section -->
    <div class="card preview-card">
      <h3>2. Live PDF Preview</h3>
      <p class="preview-hint">Your document preview will appear below after uploading:</p>
      <div id="pdf-preview-container">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
