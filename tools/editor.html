<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Click & Edit PDF Suite</title>
  <link rel="stylesheet" href="../style.css">
  
  <!-- PDF-LIB, PDF.JS, and FABRIC.JS Libraries -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <style>
    .editor-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px auto;
      max-width: 1100px;
    }
    .toolbar {
      background: #2c3e50;
      color: white;
      padding: 10px 15px;
      width: 100%;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      border-radius: 8px 8px 0 0;
    }
    .toolbar button, .toolbar label {
      background: #e74c3c;
      color: white;
      padding: 7px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .toolbar button:hover { background: #c0392b; }
    .toolbar input[type="file"] { display: none; }
    
    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
    }
    .tool-group select, .tool-group input {
      padding: 4px;
      border-radius: 3px;
      border: none;
      font-size: 0.85rem;
    }

    #canvas-container {
      position: relative;
      background: #525659;
      width: 100%;
      min-height: 550px;
      display: flex;
      justify-content: center;
      padding: 20px;
      overflow: auto;
      border-radius: 0 0 8px 8px;
    }

    .canvas-wrapper-inner {
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #fabric-canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📄 Smart PDF Text Editor</h1>
    <p>Click Anywhere on Page to Erase & Type New Text Instantly</p>
  </header>

  <div class="tool-container">
    <a href="../index.html" class="back-link">← Back to All Tools</a>

    <div class="editor-wrapper">
      <!-- Controls Toolbar -->
      <div class="toolbar">
        <label for="pdf-file-input">📁 Open PDF</label>
        <input type="file" id="pdf-file-input" accept="application/pdf">

        <button id="edit-mode-btn" onclick="toggleEditMode()" style="background:#f39c12;">🎯 Click-to-Edit: OFF</button>

        <div class="tool-group">
          <label style="background:none; padding:0;">Font:</label>
          <select id="font-family" onchange="updateSelectedText()">
            <option value="Arial">Arial</option>
            <option value="Helvetica">Helvetica</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
          </select>

          <label style="background:none; padding:0;">Size:</label>
          <input type="number" id="font-size" value="18" min="8" max="72" style="width: 50px;" onchange="updateSelectedText()">

          <input type="color" id="font-color" value="#000000" onchange="updateSelectedText()">
        </div>

        <button onclick="exportEditedPdf()" style="margin-left: auto; background: #27ae60;">💾 Export PDF</button>
      </div>

      <!-- PDF Viewing Canvas -->
      <div id="canvas-container">
        <div class="canvas-wrapper-inner" id="wrapper-inner">
          <canvas id="pdf-background-canvas"></canvas>
          <canvas id="fabric-canvas"></canvas>
        </div>
      </div>
    </div>

    <div id="status" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>
  </div>

  <script>
    // Credit: (hank!nd3 p4d4y41!

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfBytes = null;
    let pdfDocObj = null;
    let fabricCanvas = null;
    let currentViewport = null;
    let isEditModeActive = false;

    // Initialize Interactive Fabric Canvas
    function initFabric(width, height) {
      if (fabricCanvas) {
        fabricCanvas.dispose();
      }
      fabricCanvas = new fabric.Canvas('fabric-canvas', {
        width: width,
        height: height
      });

      // Handle Mouse Click Event for Auto-Erase & Replacement
      fabricCanvas.on('mouse:down', function(options) {
        if (!isEditModeActive) return;

        // Ignore click if clicking an existing canvas object
        if (options.target) return;

        const pointer = fabricCanvas.getPointer(options.e);
        const font = document.getElementById('font-family').value;
        const size = parseInt(document.getElementById('font-size').value, 10);
        const color = document.getElementById('font-color').value;

        // 1. Auto-Erase Rectangle (Masks old underlying PDF text)
        const maskRect = new fabric.Rect({
          left: pointer.x - 2,
          top: pointer.y - 2,
          fill: 'white',
          width: 140,
          height: size + 6,
          selectable: true
        });

        // 2. Editable Text Object over the Mask
        const newText = new fabric.IText('New Text', {
          left: pointer.x,
          top: pointer.y,
          fontFamily: font,
          fontSize: size,
          fill: color
        });

        // Group rect and text together or add independently
        fabricCanvas.add(maskRect);
        fabricCanvas.add(newText);
        fabricCanvas.setActiveObject(newText);
        newText.enterEditing();
        newText.selectAll();
      });
    }

    // Toggle Click-to-Edit Mode
    function toggleEditMode() {
      if (!fabricCanvas) {
        alert("Please load a PDF file first!");
        return;
      }

      isEditModeActive = !isEditModeActive;
      const btn = document.getElementById('edit-mode-btn');

      if (isEditModeActive) {
        btn.innerText = "🎯 Click-to-Edit: ON";
        btn.style.background = "#27ae60";
        document.getElementById('status').innerText = "Click-to-Edit ON: Click on any text in the PDF to erase & replace it!";
      } else {
        btn.innerText = "🎯 Click-to-Edit: OFF";
        btn.style.background = "#f39c12";
        document.getElementById('status').innerText = "Click-to-Edit OFF.";
      }
    }

    // Open & Load PDF File
    document.getElementById('pdf-file-input').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      const status = document.getElementById('status');
      if (!file) return;

      status.style.color = "#d35400";
      status.innerText = "Loading PDF...";

      pdfBytes = await file.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
      pdfDocObj = await loadingTask.promise;

      // Render First Page
      const page = await pdfDocObj.getPage(1);
      currentViewport = page.getViewport({ scale: 1.2 });

      const bgCanvas = document.getElementById('pdf-background-canvas');
      const context = bgCanvas.getContext('2d');
      bgCanvas.height = currentViewport.height;
      bgCanvas.width = currentViewport.width;

      const renderContext = { canvasContext: context, viewport: currentViewport };
      await page.render(renderContext).promise;

      initFabric(currentViewport.width, currentViewport.height);

      status.style.color = "#27ae60";
      status.innerText = "PDF Loaded Successfully! Turn ON 'Click-to-Edit' to edit text.";
    });

    // Update Font/Size/Color of Selected Element
    function updateSelectedText() {
      if (!fabricCanvas) return;
      const activeObj = fabricCanvas.getActiveObject();

      if (activeObj && activeObj.type === 'i-text') {
        activeObj.set({
          fontFamily: document.getElementById('font-family').value,
          fontSize: parseInt(document.getElementById('font-size').value, 10),
          fill: document.getElementById('font-color').value
        });
        fabricCanvas.renderAll();
      }
    }

    // Export Final Edited PDF
    async function exportEditedPdf() {
      if (!pdfBytes) {
        alert("No PDF loaded!");
        return;
      }

      const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
      const firstPage = pdfDoc.getPages()[0];
      const pageHeight = firstPage.getHeight();

      const objects = fabricCanvas.getObjects();

      for (let obj of objects) {
        // Draw Auto-Whiteout Rectangles
        if (obj.type === 'rect') {
          const pdfX = (obj.left / currentViewport.width) * firstPage.getWidth();
          const pdfY = pageHeight - ((obj.top / currentViewport.height) * pageHeight) - ((obj.height * obj.scaleY) / currentViewport.height * pageHeight);
          const pdfW = ((obj.width * obj.scaleX) / currentViewport.width) * firstPage.getWidth();
          const pdfH = ((obj.height * obj.scaleY) / currentViewport.height) * pageHeight;

          firstPage.drawRectangle({
            x: pdfX,
            y: pdfY,
            width: pdfW,
            height: pdfH,
            color: PDFLib.rgb(1, 1, 1)
          });
        }

        // Draw Replacement Texts
        if (obj.type === 'i-text') {
          const pdfX = (obj.left / currentViewport.width) * firstPage.getWidth();
          const pdfY = pageHeight - ((obj.top / currentViewport.height) * pageHeight) - 14;

          firstPage.drawText(obj.text, {
            x: pdfX,
            y: pdfY,
            size: (obj.fontSize * (firstPage.getWidth() / currentViewport.width)),
            color: PDFLib.rgb(0, 0, 0)
          });
        }
      }

      const modifiedBytes = await pdfDoc.save();
      const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'edited_document.pdf';
      link.click();
    }
  </script>

</body>
</html>
