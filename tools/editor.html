<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Powered Precise PDF Editor</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background-color: #2f3640; color: #fff; }

    .main-toolbar {
      background: #1e272e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 3000;
    }

    .main-toolbar label, .main-toolbar button {
      background: #0984e3;
      color: white;
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .main-toolbar input[type="file"] { display: none; }

    #pdf-container {
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .page-wrapper {
      position: relative;
      background: white;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .textLayer {
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
    }

    .textLayer span {
      position: absolute;
      white-space: pre;
      cursor: text;
      color: #000000;
      border: 1px dashed transparent;
      outline: none;
      line-height: 1.0;
      padding: 1px;
    }

    .textLayer span:hover { border: 1px dashed #0984e3; }
    .textLayer span:focus {
      border: 1px solid #e1b12c !important;
      background-color: rgba(255, 255, 255, 0.8) !important;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="main-toolbar">
    <label for="pdf-file-input">📂 Open PDF</label>
    <input type="file" id="pdf-file-input" accept="application/pdf">
    <span id="status" style="color: #fbc531;">Select PDF</span>
    <button onclick="processWithPdfCo()">💾 Save Clean PDF (Via API)</button>
  </div>

  <div id="pdf-container">
    <div class="page-wrapper" id="page-wrapper">
      <canvas id="pdf-render-canvas"></canvas>
      <div id="text-layer" class="textLayer"></div>
    </div>
  </div>

  <script>
    // Credit: (hank!nd3 p4d4y41!
    const API_KEY = "Fayasmonu24619@gmail.com_qGYRpdN8W8xJHDM8Ce8qYzjlXoKiq94QUhKQW2W7ryOHpeBOPbHJ8RYYUrVRT2Ty";

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let currentFile = null;
    let currentViewport = null;

    document.getElementById('pdf-file-input').addEventListener('change', async function(e) {
      currentFile = e.target.files[0];
      if (!currentFile) return;

      document.getElementById('status').innerText = "Rendering PDF...";
      const arrayBuffer = await currentFile.arrayBuffer();

      const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
      const pdfDocObj = await loadingTask.promise;

      const page = await pdfDocObj.getPage(1);
      
      const containerWidth = document.getElementById('pdf-container').clientWidth || 380;
      const unscaledViewport = page.getViewport({ scale: 1.0 });
      let scale = (containerWidth - 20) / unscaledViewport.width;
      if (scale > 1.4) scale = 1.3;

      currentViewport = page.getViewport({ scale: scale });

      const canvas = document.getElementById('pdf-render-canvas');
      const context = canvas.getContext('2d');
      canvas.height = currentViewport.height;
      canvas.width = currentViewport.width;

      const pageWrapper = document.getElementById('page-wrapper');
      pageWrapper.style.width = currentViewport.width + 'px';
      pageWrapper.style.height = currentViewport.height + 'px';

      await page.render({ canvasContext: context, viewport: currentViewport }).promise;

      const textContent = await page.getTextContent();
      const textLayerDiv = document.getElementById('text-layer');
      textLayerDiv.innerHTML = '';

      textContent.items.forEach((item, index) => {
        if (item.str.trim() === '') return;

        const span = document.createElement('span');
        span.contentEditable = true;
        span.innerText = item.str;

        const tx = pdfjsLib.Util.transform(currentViewport.transform, item.transform);
        const x = tx[4];
        const y = tx[5] - (item.height * currentViewport.scale);

        span.style.left = x + 'px';
        span.style.top = y + 'px';
        span.style.fontSize = (Math.sqrt(item.transform[0] * item.transform[0]) * currentViewport.scale) + 'px';

        span.dataset.original = item.str;

        textLayerDiv.appendChild(span);
      });

      document.getElementById('status').innerText = "Ready! Tap text to edit.";
    });

    async function processWithPdfCo() {
      if (!currentFile) return;

      document.getElementById('status').innerText = "Uploading to Cloud API Engine...";

      try {
        // Step 1: Upload PDF to PDF.co temporary storage
        const formData = new FormData();
        formData.append("file", currentFile);

        const uploadRes = await fetch("https://api.pdf.co/v1/file/upload", {
          method: "POST",
          headers: { "x-api-key": API_KEY },
          body: formData
        });

        const uploadData = await uploadRes.json();
        if (uploadData.error) throw new Error(uploadData.message);

        const uploadedFileUrl = uploadData.url;
        document.getElementById('status').innerText = "Processing Text Replacements...";

        // Step 2: Extract updated text fields
        const spans = document.querySelectorAll('#text-layer span');
        const searchAndReplaceRequests = [];

        spans.forEach(span => {
          const original = span.dataset.original;
          const updated = span.innerText;

          if (original !== updated) {
            searchAndReplaceRequests.push({
              searchString: original,
              replaceString: updated,
              caseSensitive: true
            });
          }
        });

        if (searchAndReplaceRequests.length === 0) {
          document.getElementById('status').innerText = "No changes detected to save.";
          return;
        }

        // Step 3: Replace text using API
        const editRes = await fetch("https://api.pdf.co/v1/pdf/edit/replace-text", {
          method: "POST",
          headers: {
            "x-api-key": API_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: uploadedFileUrl,
            searchAndReplaceRequests: searchAndReplaceRequests,
            async: false
          })
        });

        const editData = await editRes.json();
        if (editData.error) throw new Error(editData.message);

        // Step 4: Download updated PDF
        document.getElementById('status').innerText = "Downloading Edited PDF...";
        const pdfResponse = await fetch(editData.url);
        const pdfBlob = await pdfResponse.blob();

        const link = document.createElement('a');
        link.href = URL.createObjectURL(pdfBlob);
        link.download = 'API_Clean_Edited.pdf';
        link.click();

        document.getElementById('status').innerText = "Saved Perfectly!";

      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = "API Error: " + err.message;
      }
    }
  </script>

</body>
</html>
