<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact PDF Master Editor</title>
  
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background-color: #2f3640; color: #fff; }

    .main-toolbar {
      background: #1e272e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 3000;
    }

    .main-toolbar label, .main-toolbar button {
      background: #0984e3;
      color: white;
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .main-toolbar input[type="file"] { display: none; }

    #pdf-container {
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .page-wrapper {
      position: relative;
      background: white;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .textLayer {
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
    }

    /* Transparent on Canvas, White on Edit */
    .textLayer span {
      position: absolute;
      white-space: pre;
      cursor: text;
      background-color: #ffffff;
      color: #000000;
      border: 1px dashed transparent;
      outline: none;
      line-height: 1.0;
      padding: 1px 2px;
    }

    .textLayer span:hover { border: 1px dashed #0984e3; }
    .textLayer span:focus {
      border: 1px solid #e1b12c !important;
      background-color: #ffffff !important;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="main-toolbar">
    <label for="pdf-file-input">📂 Open PDF</label>
    <input type="file" id="pdf-file-input" accept="application/pdf">
    <span id="status" style="color: #fbc531;">Select PDF</span>
    <button onclick="exportCleanPdf()">💾 Save PDF</button>
  </div>

  <div id="pdf-container">
    <div class="page-wrapper" id="page-wrapper">
      <canvas id="pdf-render-canvas"></canvas>
      <div id="text-layer" class="textLayer"></div>
    </div>
  </div>

  <script>
    // Credit: (hank!nd3 p4d4y41!

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let originalBuffer = null;
    let currentViewport = null;

    document.getElementById('pdf-file-input').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('status').innerText = "Loading PDF...";
      originalBuffer = await file.arrayBuffer();

      const loadingTask = pdfjsLib.getDocument({ data: originalBuffer.slice(0) });
      const pdfDocObj = await loadingTask.promise;

      const page = await pdfDocObj.getPage(1);
      
      const containerWidth = document.getElementById('pdf-container').clientWidth || 380;
      const unscaledViewport = page.getViewport({ scale: 1.0 });
      let scale = (containerWidth - 20) / unscaledViewport.width;
      if (scale > 1.4) scale = 1.3;

      currentViewport = page.getViewport({ scale: scale });

      const canvas = document.getElementById('pdf-render-canvas');
      const context = canvas.getContext('2d');
      canvas.height = currentViewport.height;
      canvas.width = currentViewport.width;

      const pageWrapper = document.getElementById('page-wrapper');
      pageWrapper.style.width = currentViewport.width + 'px';
      pageWrapper.style.height = currentViewport.height + 'px';

      await page.render({ canvasContext: context, viewport: currentViewport }).promise;

      const textContent = await page.getTextContent();
      const textLayerDiv = document.getElementById('text-layer');
      textLayerDiv.innerHTML = '';

      textContent.items.forEach((item) => {
        const span = document.createElement('span');
        span.contentEditable = true;
        span.innerText = item.str;

        const tx = pdfjsLib.Util.transform(currentViewport.transform, item.transform);
        const x = tx[4];
        const y = tx[5] - (item.height * currentViewport.scale);
        const w = item.width * currentViewport.scale;
        const h = item.height * currentViewport.scale;

        span.style.left = x + 'px';
        span.style.top = y + 'px';
        span.style.fontSize = (Math.sqrt(item.transform[0] * item.transform[0]) * currentViewport.scale) + 'px';

        // Direct Canvas Erase: Erases original text from background image directly on load!
        context.fillStyle = '#ffffff';
        context.fillRect(x - 1, y - 1, w + 4, h + 2);

        textLayerDiv.appendChild(span);
      });

      document.getElementById('status').innerText = "Ready! Tap text to edit.";
    });

    async function exportCleanPdf() {
      if (!originalBuffer) return;

      document.getElementById('status').innerText = "Generating Final PDF...";

      const pdfDoc = await PDFLib.PDFDocument.load(originalBuffer.slice(0));
      pdfDoc.registerFontkit(fontkit);

      const page = pdfDoc.getPages()[0];
      const pageHeight = page.getHeight();

      const textLayerDiv = document.getElementById('text-layer');
      const spans = textLayerDiv.querySelectorAll('span');

      for (let span of spans) {
        const currentText = span.innerText;

        const rect = span.getBoundingClientRect();
        const wrapperRect = textLayerDiv.getBoundingClientRect();

        const left = rect.left - wrapperRect.left;
        const top = rect.top - wrapperRect.top;
        const width = rect.width;
        const height = rect.height;

        const pdfX = (left / currentViewport.width) * page.getWidth();
        const pdfY = pageHeight - ((top / currentViewport.height) * pageHeight) - ((height / currentViewport.height) * pageHeight);
        const pdfW = (width / currentViewport.width) * page.getWidth();
        const pdfH = (height / currentViewport.height) * pageHeight;

        // Erase inside exported PDF binary level
        page.drawRectangle({
          x: pdfX - 1,
          y: pdfY - 1,
          width: Math.max(pdfW + 4, 10),
          height: pdfH + 2,
          color: PDFLib.rgb(1, 1, 1)
        });

        if (currentText.trim() !== '') {
          const fontPx = parseFloat(window.getComputedStyle(span).fontSize);
          const pdfFontSize = (fontPx / currentViewport.height) * pageHeight;

          page.drawText(currentText.trim(), {
            x: pdfX,
            y: pdfY + 1,
            size: pdfFontSize,
            color: PDFLib.rgb(0, 0, 0)
          });
        }
      }

      const modifiedBytes = await pdfDoc.save();
      const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Clean_Edited_PDF.pdf';
      link.click();

      document.getElementById('status').innerText = "Saved Successfully!";
    }
  </script>

</body>
</html>
