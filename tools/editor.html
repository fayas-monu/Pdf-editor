<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Editor - Add Text & Images</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>

  <header>
    <h1>✍️ Online PDF Editor</h1>
    <p>Overlay text and image attachments onto your PDF pages</p>
  </header>

  <div class="tool-container">
    <a href="../index.html" class="back-link">← Back to All Tools</a>

    <div class="editor-card">
      <label for="pdf-file">1. Select PDF File:</label>
      <input type="file" id="pdf-file" accept="application/pdf">

      <label for="overlay-text">2. Enter Text Overlay:</label>
      <input type="text" id="overlay-text" placeholder="Type text to place on page">

      <label for="image-file">3. Select Image/Photo (Optional):</label>
      <input type="file" id="image-file" accept="image/png, image/jpeg">

      <button onclick="processAndDownload()">Export & Download PDF</button>

      <div id="status"></div>
    </div>
  </div>

  <script>
    // Credit: (hank!nd3 p4d4y41!

    async function processAndDownload() {
      const pdfFileInput = document.getElementById('pdf-file').files[0];
      const imageFileInput = document.getElementById('image-file').files[0];
      const textOverlay = document.getElementById('overlay-text').value;
      const status = document.getElementById('status');

      if (!pdfFileInput) {
        alert("Please select a PDF file first!");
        return;
      }

      status.style.color = "#d35400";
      status.innerText = "Processing PDF... Please wait...";

      try {
        const pdfBytes = await pdfFileInput.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
        const firstPage = pdfDoc.getPages()[0];

        // Draw Text Overlay
        if (textOverlay) {
          firstPage.drawText(textOverlay, {
            x: 50,
            y: 700,
            size: 20,
            color: PDFLib.rgb(0, 0, 0)
          });
        }

        // Embed Image
        if (imageFileInput) {
          const imgBytes = await imageFileInput.arrayBuffer();
          let img;
          if (imageFileInput.type === 'image/jpeg') {
            img = await pdfDoc.embedJpg(imgBytes);
          } else if (imageFileInput.type === 'image/png') {
            img = await pdfDoc.embedPng(imgBytes);
          }

          if (img) {
            firstPage.drawImage(img, {
              x: 400,
              y: 650,
              width: 100,
              height: 100
            });
          }
        }

        const modifiedBytes = await pdfDoc.save();

        // Download output file
        const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'edited_document.pdf';
        link.click();

        status.style.color = "#27ae60";
        status.innerText = "PDF Exported Successfully!";

      } catch (err) {
        console.error(err);
        status.style.color = "#c0392b";
        status.innerText = "Failed to process PDF.";
      }
    }
  </script>

</body>
</html>
