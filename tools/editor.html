<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real PDF Text Editor</title>
  <link rel="stylesheet" href="../style.css">
  
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    .editor-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px auto;
      width: 100%;
    }
    .toolbar {
      background: #2c3e50;
      color: white;
      padding: 10px;
      width: 100%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      border-radius: 8px 8px 0 0;
    }
    .toolbar button, .toolbar label {
      background: #e74c3c;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .toolbar input[type="file"] { display: none; }

    #pdf-container {
      position: relative;
      background: #525659;
      width: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .page-wrapper {
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      background: white;
      margin: 0 auto;
    }

    /* Text Layer for Direct Editing */
    .textLayer {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.9;
      line-height: 1.0;
    }

    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      border: 1px dotted transparent;
    }

    .textLayer span:hover, .textLayer span:focus {
      color: #000 !important;
      background: #fff !important;
      border: 1px dashed #e74c3c !important;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>📄 True PDF Text Editor</h1>
    <p>Click directly on any existing text in the PDF to edit it</p>
  </header>

  <div class="tool-container">
    <a href="../index.html" class="back-link">← Back to All Tools</a>

    <div class="editor-wrapper">
      <div class="toolbar">
        <label for="pdf-file-input">📁 Open PDF</label>
        <input type="file" id="pdf-file-input" accept="application/pdf">

        <button onclick="exportEditedPdf()" style="background: #27ae60;">💾 Export PDF</button>
      </div>

      <div id="pdf-container">
        <div class="page-wrapper" id="page-wrapper">
          <canvas id="pdf-render-canvas"></canvas>
          <div id="text-layer" class="textLayer"></div>
        </div>
      </div>
    </div>

    <div id="status" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>
  </div>

  <script>
    // Credit: (hank!nd3 p4d4y41!

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfBytes = null;
    let pdfDocObj = null;
    let currentViewport = null;
    let textDivs = [];

    document.getElementById('pdf-file-input').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      const status = document.getElementById('status');
      if (!file) return;

      status.style.color = "#d35400";
      status.innerText = "Loading PDF...";

      pdfBytes = await file.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
      pdfDocObj = await loadingTask.promise;

      const page = await pdfDocObj.getPage(1);
      
      const containerWidth = document.getElementById('pdf-container').clientWidth || 360;
      const unscaledViewport = page.getViewport({ scale: 1.0 });
      let scale = (containerWidth - 40) / unscaledViewport.width;
      if (scale > 1.3) scale = 1.2;

      currentViewport = page.getViewport({ scale: scale });

      const canvas = document.getElementById('pdf-render-canvas');
      const context = canvas.getContext('2d');
      canvas.height = currentViewport.height;
      canvas.width = currentViewport.width;

      const pageWrapper = document.getElementById('page-wrapper');
      pageWrapper.style.width = currentViewport.width + 'px';
      pageWrapper.style.height = currentViewport.height + 'px';

      // 1. Render Canvas Background
      await page.render({ canvasContext: context, viewport: currentViewport }).promise;

      // 2. Extract and Render Editable Text Layer
      const textContent = await page.getTextContent();
      const textLayerDiv = document.getElementById('text-layer');
      textLayerDiv.innerHTML = '';
      textDivs = [];

      pdfjsLib.renderTextLayer({
        textContent: textContent,
        container: textLayerDiv,
        viewport: currentViewport,
        textDivs: textDivs
      }).promise.then(() => {
        // Make each text span directly editable
        const spans = textLayerDiv.querySelectorAll('span');
        spans.forEach(span => {
          span.contentEditable = true;
          span.setAttribute('data-original-text', span.innerText);
        });

        status.style.color = "#27ae60";
        status.innerText = "PDF Loaded! Click directly on any text to edit or replace it.";
      });
    });

    // Save and Export Modified PDF
    async function exportEditedPdf() {
      if (!pdfBytes) {
        alert("No PDF loaded!");
        return;
      }

      const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
      const firstPage = pdfDoc.getPages()[0];
      const pageHeight = firstPage.getHeight();

      const textLayerDiv = document.getElementById('text-layer');
      const spans = textLayerDiv.querySelectorAll('span');

      for (let span of spans) {
        const originalText = span.getAttribute('data-original-text');
        const currentText = span.innerText;

        // If user modified this specific text
        if (originalText !== currentText) {
          const rect = span.getBoundingClientRect();
          const wrapperRect = textLayerDiv.getBoundingClientRect();

          const left = rect.left - wrapperRect.left;
          const top = rect.top - wrapperRect.top;
          const width = rect.width;
          const height = rect.height;

          // Convert to PDF Coordinates
          const pdfX = (left / currentViewport.width) * firstPage.getWidth();
          const pdfY = pageHeight - ((top / currentViewport.height) * pageHeight) - ((height / currentViewport.height) * pageHeight);
          const pdfW = (width / currentViewport.width) * firstPage.getWidth();
          const pdfH = (height / currentViewport.height) * pageHeight;

          // Erase old text area
          firstPage.drawRectangle({
            x: pdfX - 1,
            y: pdfY - 1,
            width: pdfW + 4,
            height: pdfH + 2,
            color: PDFLib.rgb(1, 1, 1)
          });

          // Write new updated text
          firstPage.drawText(currentText, {
            x: pdfX,
            y: pdfY + 2,
            size: (height / currentViewport.height) * pageHeight * 0.75,
            color: PDFLib.rgb(0, 0, 0)
          });
        }
      }

      const modifiedBytes = await pdfDoc.save();
      const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'edited_document.pdf';
      link.click();
    }
  </script>

</body>
</html>
