<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video to MP3 Converter - PDF EDIT TOOL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f5f8; color: #333; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: #e5322d; text-decoration: none; text-transform: uppercase; }
    
    .container { max-width: 650px; margin: 40px auto; padding: 20px; width: 100%; flex: 1; }
    .card { background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    .upload-area { border: 2px dashed #e5322d; border-radius: 8px; padding: 40px 20px; text-align: center; cursor: pointer; background: #fff5f5; transition: 0.2s; }
    .upload-area:hover { background: #ffebee; }
    .upload-area i { font-size: 42px; color: #e5322d; margin-bottom: 10px; }
    
    .file-info { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 15px; border-radius: 6px; margin: 20px 0; font-weight: 600; font-size: 14px; border: 1px solid #eee; }
    
    .btn { background: #e5322d; color: #fff; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 100%; transition: 0.2s; }
    .btn:hover { background: #c62828; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    
    #status { margin-top: 15px; text-align: center; font-size: 14px; font-weight: 600; color: #e5322d; }
    
    footer { background: #fff; border-top: 1px solid #e0e0e0; padding: 15px; text-align: center; font-size: 13px; color: #777; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="logo"><i class="fa-solid fa-file-pdf"></i> PDF EDIT TOOL</a>
  </header>

  <div class="container">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 20px;">Video to MP3 Converter</h2>
      
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <i class="fa-solid fa-file-audio"></i>
        <h3>Select Video File</h3>
        <p style="font-size: 13px; color: #777; margin-top: 5px;">Supports MP4, WEBM, MOV, AVI</p>
        <input type="file" id="fileInput" accept="video/*" style="display:none;" onchange="handleFile(this.files[0])">
      </div>

      <div id="editorArea" style="display: none;">
        <div class="file-info">
          <span id="fileName">video.mp4</span>
          <span id="fileSize" style="color:#e5322d;">0 MB</span>
        </div>

        <button class="btn" id="convertBtn" onclick="convertToMP3()">Convert to MP3 Now</button>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 PDF EDIT TOOL. All rights reserved. | Credit: <strong>(hank!nd3 p4d4y41!</strong>
  </footer>

  <script>
    let currentFile = null;

    function handleFile(file) {
      if (!file) return;
      currentFile = file;

      document.getElementById('uploadArea').style.display = 'none';
      document.getElementById('editorArea').style.display = 'block';

      document.getElementById('fileName').innerText = file.name;
      document.getElementById('fileSize').innerText = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
    }

    async function convertToMP3() {
      const status = document.getElementById('status');
      const btn = document.getElementById('convertBtn');

      btn.disabled = true;
      status.innerText = "Extracting Audio from Video...";

      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await currentFile.arrayBuffer();
        
        status.innerText = "Decoding Audio Track...";
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        status.innerText = "Encoding to MP3/WAV Audio...";
        const wavBlob = audioBufferToWav(audioBuffer);

        const link = document.createElement('a');
        link.href = URL.createObjectURL(wavBlob);
        
        // Original filename change to .mp3
        const outputName = currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) + '.mp3';
        link.download = outputName;
        link.click();

        status.innerText = "Conversion Complete! Audio Downloaded.";
      } catch (err) {
        console.error(err);
        status.innerText = "Conversion failed. Please try another video file.";
      } finally {
        btn.disabled = false;
      }
    }

    // Audio Buffer to Audio File Blob Converter
    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sampleRate = buffer.sampleRate, offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt "
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(sampleRate);
      setUint32(sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164); // "data"
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: 'audio/mp3' });
    }
  </script>
</body>
</html>
