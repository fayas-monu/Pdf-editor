<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Downloader - PDF EDIT TOOL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f5f8;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 900;
      color: #e5322d;
      text-decoration: none;
      text-transform: uppercase;
    }

    .container {
      max-width: 750px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 90%;
    }

    h1 {
      font-size: 24px;
      color: #1a1a1a;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-box input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    .input-box button {
      background: #e5322d;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }

    .input-box button:hover {
      background: #c62828;
    }

    /* Video Details Box */
    .video-card {
      display: none;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      background: #fafafa;
      margin-top: 20px;
    }

    .video-info {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }

    .video-info img {
      width: 140px;
      border-radius: 6px;
    }

    .video-details h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .size-badge {
      display: inline-block;
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      margin-top: 5px;
    }

    .download-btn {
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    .download-btn:hover {
      background: #218838;
    }

    .download-btn:disabled {
      background: #81c784;
      cursor: not-allowed;
    }

    /* Real-Time Progress Bar */
    .progress-box {
      display: none;
      margin-top: 20px;
    }

    .progress-status {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .progress-container {
      width: 100%;
      background: #e0e0e0;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #28a745;
      transition: width 0.2s ease;
    }

    footer {
      background: #ffffff;
      border-top: 1px solid #e0e0e0;
      margin-top: auto;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="logo-container">
      <i class="fa-solid fa-file-pdf"></i>
      <span>PDF EDIT TOOL</span>
    </a>
  </header>

  <div class="container">
    <h1><i class="fa-brands fa-youtube" style="color: red;"></i> YouTube Downloader</h1>
    <p class="subtitle">Direct Ad-Free High Quality Downloads</p>

    <div class="input-box">
      <input type="text" id="youtubeUrl" placeholder="Paste YouTube link here...">
      <button onclick="fetchVideoDetails()" id="getBtn">Get Video</button>
    </div>

    <!-- Video Card -->
    <div class="video-card" id="videoCard">
      <div class="video-info">
        <img id="thumb" src="" alt="Thumbnail">
        <div class="video-details">
          <h3 id="videoTitle">YouTube Video</h3>
          <p>File Size: <span class="size-badge" id="fileSize">Fetching Size...</span></p>
        </div>
      </div>
      <button class="download-btn" id="startBtn" onclick="startDirectDownload()">Start Download</button>
    </div>

    <!-- Live Progress Bar -->
    <div class="progress-box" id="progressBox">
      <div class="progress-status">
        <span id="statusText">Downloading File...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 PDF EDIT TOOL. All rights reserved. | Credit: <strong>(hank!nd3 p4d4y41! | FAYAS MONU</strong>
  </footer>

  <script>
    let downloadUrl = "";

    // YouTube Video ID വേർതിരിച്ചെടുക്കുന്ന ഫംഗ്ഷൻ
    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function fetchVideoDetails() {
      const rawUrl = document.getElementById('youtubeUrl').value.trim();
      const videoId = extractYouTubeID(rawUrl);

      if (!videoId) {
        alert("Please paste a valid YouTube video URL!");
        return;
      }

      // ശുദ്ധീകരിച്ച ഒറിജിനൽ ലിങ്ക് മാത്രം എടുക്കുന്നു (?si താക്കോലുകൾ മാറ്റുന്നു)
      const cleanUrl = `https://www.youtube.com/watch?v=${videoId}`;

      document.getElementById('getBtn').innerText = "Fetching...";
      document.getElementById('getBtn').disabled = true;
      document.getElementById('videoCard').style.display = 'none';
      document.getElementById('progressBox').style.display = 'none';

      // പബ്ലിക് എപിഐ സർവറുകൾ
      const apiInstances = [
        "https://co.wuk.sh/api/json",
        "https://api.cobalt.tools/api/json"
      ];

      let success = false;

      for (let api of apiInstances) {
        try {
          const res = await fetch(api, {
            method: "POST",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              url: cleanUrl,
              vQuality: "max"
            })
          });

          const data = await res.json();

          if (data.url || (data.picker && data.picker[0].url)) {
            downloadUrl = data.url || data.picker[0].url;
            
            document.getElementById('videoTitle').innerText = "YouTube Video (" + videoId + ")";
            document.getElementById('thumb').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            
            // ഫയൽ സൈസ് കണക്കാക്കുന്നു
            fetchFileSize(downloadUrl);

            document.getElementById('videoCard').style.display = 'block';
            success = true;
            break;
          }
        } catch (e) {
          console.log("Retrying next API instance...");
        }
      }

      if (!success) {
        alert("Server connection failed. Please try again after a moment.");
      }

      document.getElementById('getBtn').innerText = "Get Video";
      document.getElementById('getBtn').disabled = false;
    }

    // കൃത്യമായ MB സൈസ് എടുക്കുന്നു
    async function fetchFileSize(url) {
      try {
        const response = await fetch(url, { method: 'HEAD' });
        const size = response.headers.get('content-length');
        if (size) {
          const sizeInMB = (parseInt(size) / (1024 * 1024)).toFixed(2);
          document.getElementById('fileSize').innerText = sizeInMB + " MB";
        } else {
          document.getElementById('fileSize').innerText = "Full HD Original";
        }
      } catch (e) {
        document.getElementById('fileSize').innerText = "Full HD Original";
      }
    }

    // 0 to 100% പ്രോഗ്രസ്സോടെ സ്വന്തം സൈറ്റിൽ ഡൗൺലോഡ് ചെയ്യൽ
    async function startDirectDownload() {
      if (!downloadUrl) return;

      document.getElementById('startBtn').disabled = true;
      document.getElementById('progressBox').style.display = 'block';

      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const statusText = document.getElementById('statusText');

      try {
        const response = await fetch(downloadUrl);
        
        if (!response.ok) throw new Error("Network error");

        const reader = response.body.getReader();
        const contentLength = +response.headers.get('Content-Length');

        let receivedBytes = 0;
        let chunks = [];

        while(true) {
          const {done, value} = await reader.read();
          if (done) break;

          chunks.push(value);
          receivedBytes += value.length;

          if (contentLength) {
            const percent = Math.round((receivedBytes / contentLength) * 100);
            progressBar.style.width = percent + '%';
            progressPercent.innerText = percent + '%';
          }
        }

        statusText.innerText = "Saving to your device...";
        
        // പരസ്യങ്ങൾ ഇല്ലാതെ ഡയറക്ട് ഫോൾഡറിലേക്ക് ഫയൽ ഡൗൺലോഡ് ആക്കുന്നു
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const downloadLink = document.createElement('a');
        downloadLink.href = URL.createObjectURL(blob);
        downloadLink.download = "YouTube_Video.mp4";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();

        statusText.innerText = "Download Completed!";
      } catch (err) {
        // ഏതെങ്കിലും കാരണവശാൽ പ്രോഗ്രസ് ഡൗൺലോഡ് ബ്ലോക്ക് ആയാൽ ഡയറക്ട് ഫയൽ ലിങ്ക് വഴി നൽകും
        window.location.href = downloadUrl;
      } finally {
        document.getElementById('startBtn').disabled = false;
      }
    }
  </script>
</body>
</html>
