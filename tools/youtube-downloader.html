<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader - PDF EDIT TOOL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 900;
      color: #e5322d;
      text-decoration: none;
      text-transform: uppercase;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 92%;
    }

    h1 {
      font-size: 24px;
      color: #1a1a1a;
      margin-bottom: 6px;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-box input {
      flex: 1;
      padding: 14px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .input-box button {
      background: #e5322d;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }

    .video-card {
      display: none;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
    }

    .video-info {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }

    .video-info img {
      width: 130px;
      border-radius: 8px;
      object-fit: cover;
    }

    .video-details {
      flex: 1;
    }

    .video-details h3 {
      font-size: 15px;
      color: #222;
      margin-bottom: 8px;
    }

    .quality-selector label {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      display: block;
      margin-bottom: 6px;
    }

    .quality-selector select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      background: white;
      outline: none;
    }

    .file-size-info {
      margin-top: 10px;
      font-size: 13px;
      color: #007bff;
      font-weight: 700;
    }

    .action-btn {
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      display: block;
      text-align: center;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      color: #555;
    }

    footer {
      background: #ffffff;
      border-top: 1px solid #e0e0e0;
      margin-top: auto;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="logo-container">
      <i class="fa-solid fa-file-pdf"></i>
      <span>PDF EDIT TOOL</span>
    </a>
  </header>

  <div class="container">
    <h1><i class="fa-brands fa-youtube" style="color: red;"></i> YouTube Downloader</h1>
    <p class="subtitle">Instant Fast Downloads with Quality & Size Selection</p>

    <div class="input-box">
      <input type="text" id="youtubeUrl" placeholder="Paste YouTube video link here...">
      <button onclick="loadVideoData()" id="getBtn">Get Video</button>
    </div>

    <div class="video-card" id="videoCard">
      <div class="video-info">
        <img id="thumb" src="" alt="Thumbnail">
        <div class="video-details">
          <h3 id="videoTitle">YouTube Video</h3>
          
          <div class="quality-selector">
            <label for="qualitySelect"><i class="fa-solid fa-sliders"></i> Choose Quality / Format:</label>
            <select id="qualitySelect" onchange="updateSizeDisplay()">
              <option value="1080" data-size="~75.0 MB">MP4 - 1080p Full HD</option>
              <option value="720" data-size="~38.0 MB" selected>MP4 - 720p HD</option>
              <option value="480" data-size="~20.0 MB">MP4 - 480p SD</option>
              <option value="360" data-size="~12.0 MB">MP4 - 360p Low</option>
              <option value="mp3" data-size="~4.5 MB">MP3 - Audio Only</option>
            </select>
          </div>

          <div class="file-size-info" id="sizeDisplay">
            File Size: ~38.0 MB
          </div>
        </div>
      </div>

      <button class="action-btn" id="downloadBtn" onclick="startFastDownload()"><i class="fa-solid fa-download"></i> Download File</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <footer>
    &copy; 2026 PDF EDIT TOOL. All rights reserved. | Credit: <strong>(hank!nd3 p4d4y41! | FAYAS MONU</strong>
  </footer>

  <script>
    let currentVideoId = "";

    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function loadVideoData() {
      const urlInput = document.getElementById('youtubeUrl').value.trim();
      currentVideoId = extractYouTubeID(urlInput);

      if (!currentVideoId) {
        alert("Please paste a valid YouTube video URL!");
        return;
      }

      document.getElementById('videoTitle').innerText = "YouTube Video (" + currentVideoId + ")";
      document.getElementById('thumb').src = `https://img.youtube.com/vi/${currentVideoId}/hqdefault.jpg`;
      document.getElementById('videoCard').style.display = 'block';
      document.getElementById('statusMsg').innerText = "Ready to download!";
      
      updateSizeDisplay();
    }

    function updateSizeDisplay() {
      const select = document.getElementById('qualitySelect');
      const selectedOption = select.options[select.selectedIndex];
      const size = selectedOption.getAttribute('data-size');
      document.getElementById('sizeDisplay').innerText = "File Size: " + size;
    }

    function startFastDownload() {
      const status = document.getElementById('statusMsg');
      const quality = document.getElementById('qualitySelect').value;

      status.innerText = "Connecting to download server...";

      // Instant Clean Direct Download Stream
      let downloadLink = "";
      if (quality === 'mp3') {
        downloadLink = `https://api.vevioz.com/api/button/mp3/${currentVideoId}`;
      } else {
        downloadLink = `https://api.vevioz.com/api/button/videos/${currentVideoId}`;
      }

      // Open clean download stream
      const a = document.createElement('a');
      a.href = downloadLink;
      a.target = '_blank';
      a.click();

      status.innerText = "Download Started!";
    }
  </script>
</body>
</html>
