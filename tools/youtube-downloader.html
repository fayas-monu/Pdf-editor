<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Downloader - PDF EDIT TOOL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 900;
      color: #e5322d;
      text-decoration: none;
      text-transform: uppercase;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 90%;
    }

    h1 {
      font-size: 24px;
      color: #1a1a1a;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-box input {
      flex: 1;
      padding: 14px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .input-box input:focus {
      border-color: #e5322d;
    }

    .input-box button {
      background: #e5322d;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }

    .input-box button:hover {
      background: #c62828;
    }

    /* Video Card Section */
    .video-card {
      display: none;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
      margin-top: 20px;
    }

    .video-info {
      display: flex;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .video-info img {
      width: 150px;
      border-radius: 8px;
      object-fit: cover;
    }

    .video-details h3 {
      font-size: 16px;
      color: #222;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .quality-selector {
      margin-top: 15px;
    }

    .quality-selector label {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      display: block;
      margin-bottom: 6px;
    }

    .quality-selector select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      background: white;
      cursor: pointer;
      outline: none;
    }

    .size-badge {
      display: inline-block;
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      margin-top: 10px;
    }

    .download-btn {
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s;
    }

    .download-btn:hover {
      background: #218838;
    }

    .download-btn:disabled {
      background: #a5d6a7;
      cursor: not-allowed;
    }

    /* Live Progress Bar */
    .progress-box {
      display: none;
      margin-top: 20px;
    }

    .progress-status {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .progress-container {
      width: 100%;
      background: #e0e0e0;
      height: 18px;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #28a745;
      transition: width 0.2s linear;
    }

    /* Invisible Download Frame */
    #downloadIframe {
      display: none;
    }

    footer {
      background: #ffffff;
      border-top: 1px solid #e0e0e0;
      margin-top: auto;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="logo-container">
      <i class="fa-solid fa-file-pdf"></i>
      <span>PDF EDIT TOOL</span>
    </a>
  </header>

  <div class="container">
    <h1><i class="fa-brands fa-youtube" style="color: red;"></i> YouTube Downloader</h1>
    <p class="subtitle">Direct Clean Downloads with Quality Selection</p>

    <div class="input-box">
      <input type="text" id="youtubeUrl" placeholder="Paste YouTube video link here...">
      <button onclick="fetchVideoInfo()" id="getBtn">Get Video</button>
    </div>

    <!-- Video Card -->
    <div class="video-card" id="videoCard">
      <div class="video-info">
        <img id="thumb" src="" alt="Thumbnail">
        <div class="video-details">
          <h3 id="videoTitle">YouTube Video</h3>
          
          <div class="quality-selector">
            <label for="qualitySelect"><i class="fa-solid fa-sliders"></i> Choose Quality / Format:</label>
            <select id="qualitySelect" onchange="updateEstimatedSize()">
              <option value="1080" data-size="75.5 MB">MP4 - 1080p (Full HD)</option>
              <option value="720" data-size="38.2 MB" selected>MP4 - 720p (HD)</option>
              <option value="480" data-size="21.0 MB">MP4 - 480p</option>
              <option value="360" data-size="12.4 MB">MP4 - 360p</option>
              <option value="mp3" data-size="4.8 MB">MP3 - Audio Only</option>
            </select>
          </div>

          <div>
            File Size: <span class="size-badge" id="fileSize">38.2 MB</span>
          </div>
        </div>
      </div>

      <button class="download-btn" id="startBtn" onclick="triggerDownload()"><i class="fa-solid fa-download"></i> Download File</button>
    </div>

    <!-- Live Progress Bar -->
    <div class="progress-box" id="progressBox">
      <div class="progress-status">
        <span id="statusText">Preparing File...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <iframe id="downloadIframe"></iframe>

  <footer>
    &copy; 2026 PDF EDIT TOOL. All rights reserved. | Credit: <strong>(hank!nd3 p4d4y41! | FAYAS MONU</strong>
  </footer>

  <script>
    let videoId = "";

    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function fetchVideoInfo() {
      const rawUrl = document.getElementById('youtubeUrl').value.trim();
      videoId = extractYouTubeID(rawUrl);

      if (!videoId) {
        alert("Please paste a valid YouTube video URL!");
        return;
      }

      document.getElementById('videoTitle').innerText = "YouTube Video (" + videoId + ")";
      document.getElementById('thumb').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

      // Reset & Display
      updateEstimatedSize();
      document.getElementById('videoCard').style.display = 'block';
      document.getElementById('progressBox').style.display = 'none';
    }

    // Select ചെയ്ത Quality-ക്ക് അനുസരിച്ച് ലൈവായി MB മാറും
    function updateEstimatedSize() {
      const select = document.getElementById('qualitySelect');
      const selectedOption = select.options[select.selectedIndex];
      const size = selectedOption.getAttribute('data-size');
      document.getElementById('fileSize').innerText = size;
    }

    function triggerDownload() {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('progressBox').style.display = 'block';

      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const statusText = document.getElementById('statusText');

      let currentPercent = 0;

      // Realtime Countdown Simulation
      const interval = setInterval(() => {
        currentPercent += 5;
        progressBar.style.width = currentPercent + '%';
        progressPercent.innerText = currentPercent + '%';

        if (currentPercent >= 100) {
          clearInterval(interval);
          statusText.innerText = "Download Started!";

          const quality = document.getElementById('qualitySelect').value;
          const downloadUrl = `https://loader.to/api/button/?url=https://www.youtube.com/watch?v=${videoId}&f=${quality}`;
          
          // Hidden Iframe ഡൗൺലോഡ് പ്രോസസ്സ് ചെയ്യുന്നു
          document.getElementById('downloadIframe').src = downloadUrl;

          setTimeout(() => {
            document.getElementById('startBtn').disabled = false;
          }, 2000);
        }
      }, 100);
    }
  </script>
</body>
</html>
