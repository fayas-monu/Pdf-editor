<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compress PDF File Online - Reduce PDF Size</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f5f8; color: #333; }
    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: #e5322d; text-decoration: none; }
    .container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
    .upload-area { background: #fff; border: 2px dashed #388e3c; border-radius: 12px; padding: 50px 20px; cursor: pointer; margin-bottom: 20px; }
    .upload-area i { font-size: 48px; color: #388e3c; margin-bottom: 15px; }
    .btn { background: #388e3c; color: #fff; border: none; padding: 12px 30px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 15px; display: none; }
    .btn:hover { background: #2e7d32; }
    #status { font-weight: 600; color: #388e3c; margin: 15px 0; }
    .result-box { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="logo"><i class="fa-solid fa-file-pdf"></i> PDF Edit Tool</a>
  </header>
  <div class="container">
    <h1>Compress PDF File</h1>
    <p style="color:#666; margin-bottom: 20px;">Reduce your PDF size quickly directly in your browser.</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <i class="fa-solid fa-file-contract"></i>
      <h3>Select PDF file to compress</h3>
      <input type="file" id="fileInput" accept="application/pdf" style="display:none;" onchange="handleFile(this.files[0])">
    </div>
    
    <div id="status"></div>
    <button class="btn" id="compressBtn" onclick="compressPDF()">Compress & Download</button>

    <div class="result-box" id="resultBox"></div>
  </div>

  <script>
    let selectedFile = null;

    function handleFile(file) {
      if (!file) return;
      selectedFile = file;
      const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
      document.getElementById('status').innerText = `Selected File: ${file.name} (${sizeMB} MB)`;
      document.getElementById('compressBtn').style.display = 'inline-block';
      document.getElementById('resultBox').style.display = 'none';
    }

    async function compressPDF() {
      if (!selectedFile) return;

      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "Compressing PDF, please wait...";

      const originalSize = selectedFile.size;
      const arrayBuffer = await selectedFile.arrayBuffer();

      const { PDFDocument } = PDFLib;
      const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });

      // Re-save PDF with objects stream optimization
      const compressedPdfBytes = await pdfDoc.save({ useObjectStreams: true });

      const compressedBlob = new Blob([compressedPdfBytes], { type: 'application/pdf' });
      const compressedSize = compressedBlob.size;

      const savedBytes = originalSize - compressedSize;
      const savedPercent = savedBytes > 0 ? ((savedBytes / originalSize) * 100).toFixed(1) : 0;

      // Download Compressed File
      const link = document.createElement('a');
      link.href = URL.createObjectURL(compressedBlob);
      link.download = `compressed_${selectedFile.name}`;
      link.click();

      statusDiv.innerText = "Compression complete!";
      
      const resultBox = document.getElementById('resultBox');
      resultBox.style.display = 'block';
      resultBox.innerHTML = `
        <strong>Original Size:</strong> ${(originalSize / 1024).toFixed(1)} KB <br>
        <strong>Compressed Size:</strong> ${(compressedSize / 1024).toFixed(1)} KB <br>
        <span style="color: #2e7d32; font-weight: bold;">Reduced by ${savedPercent}%!</span>
      `;
    }
  </script>
</body>
</html>
